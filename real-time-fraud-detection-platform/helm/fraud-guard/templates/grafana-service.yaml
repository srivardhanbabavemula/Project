apiVersion: v1
kind: Service
metadata:
  name: {{ include "fraud-guard.grafanaService" . }}
  labels:
    {{- include "fraud-guard.labels" . | nindent 4 }}
    {{- include "fraud-guard.selectorLabels" (dict "context" . "component" "grafana") | nindent 4 }}
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
    - port: {{ .Values.grafana.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "fraud-guard.selectorLabels" (dict "context" . "component" "grafana") | nindent 4 }}
