apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fraud-guard.grafanaService" . }}-datasources
  labels:
    {{- include "fraud-guard.labels" . | nindent 4 }}
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "fraud-guard.prometheusService" . }}:{{ .Values.prometheus.service.port }}
        isDefault: true
        editable: true
      - name: PostgreSQL
        type: postgres
        url: {{ include "fraud-guard.postgresService" . }}:{{ .Values.postgres.service.port }}
        database: {{ .Values.postgres.auth.database }}
        user: {{ .Values.postgres.auth.username }}
        secureJsonData:
          password: {{ .Values.postgres.auth.password }}
        jsonData:
          sslmode: disable
          postgresVersion: 1500
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fraud-guard.grafanaService" . }}-dashboard-provider
  labels:
    {{- include "fraud-guard.labels" . | nindent 4 }}
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fraud-guard.grafanaService" . }}-dashboards
  labels:
    {{- include "fraud-guard.labels" . | nindent 4 }}
data:
  fraud_detection.json: |
    {{ .Files.Get "files/fraud_detection.json" | nindent 4 }}
